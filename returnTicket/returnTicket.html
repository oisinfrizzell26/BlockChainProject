    // Create contract instance
    const contract = new web3.eth.Contract(ABI, contractAddress);
    
    // Variables to store connected account
    let currentAccount = null;
    
    // Add event listeners when page loads
    $(document).ready(function() {
        // Connect wallet button
        $("#connectWalletButton").click(connectWallet);
        
        // Return tickets button
        $("#returnTicketsButton").click(returnTickets);
        
        // Check if MetaMask is already connected
        if (window.ethereum && window.ethereum.selectedAddress) {
            connectWallet();
        }
    });
    
    // Connect to MetaMask
    async function connectWallet() {
        if (window.ethereum) {
            try {
                // Request account access
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                currentAccount = accounts[0];
                
                // Check if connected to Sepolia (chain ID 11155111)
                const chainId = await window.ethereum.request({ method: 'eth_chainId' });
                if (chainId !== '0xaa36a7') { // Sepolia Chain ID in hex
                    showError("Please connect MetaMask to the Sepolia Test Network.");
                    try {
                        // Try to switch to Sepolia
                        await window.ethereum.request({
                            method: 'wallet_switchEthereumChain',
                            params: [{ chainId: '0xaa36a7' }], // Sepolia chain ID
                        });
                    } catch (switchError) {
                        // Network not added
                        showError("Please manually switch to the Sepolia Test Network in MetaMask.");
                    }
                    return;
                }
                
                // Update UI
                $("#walletAddress").text(currentAccount);
                $("#walletDetails").show();
                $("#returnSection").show();
                $("#connectWalletButton").html('<i class="fas fa-check"></i> Connected to MetaMask');
                
                // Load wallet balance and ticket balance
                loadWalletBalance(currentAccount);
                loadTicketBalance(currentAccount);
                
                // Listen for account changes
                window.ethereum.on('accountsChanged', function (accounts) {
                    currentAccount = accounts[0];
                    $("#walletAddress").text(currentAccount);
                    loadWalletBalance(currentAccount);
                    loadTicketBalance(currentAccount);
                });
                
            } catch (error) {
                showError("User denied account access or another error occurred: " + error.message);
            }
        } else {
            showError("MetaMask is not installed. Please install MetaMask from https://metamask.io/ to continue.");
        }
    }

    // Load wallet balance
    async function loadWalletBalance(address) {
        try {
            const balanceWei = await web3.eth.getBalance(address);
            const balanceEth = web3.utils.fromWei(balanceWei, 'ether');
            $("#walletBalance").text(balanceEth + " ETH");
        } catch (error) {
            showError("Error loading balance: " + error.message);
        }
    }
    
    // Load ticket balance
    async function loadTicketBalance(address) {
        try {
            const ticketBalance = await contract.methods.balanceOf(address).call();
            $("#ticketBalance").text(ticketBalance + " tickets");
            
            // Adjust max number of tickets that can be returned
            $("#ticketAmount").attr("max", ticketBalance);
            
            // If no tickets, disable return button
            if (ticketBalance <= 0) {
                $("#returnTicketsButton").prop("disabled", true);
                $("#ticketBalance").text("0 tickets - You have no tickets to return");
            } else {
                $("#returnTicketsButton").prop("disabled", false);
            }
        } catch (error) {
            showError("Error loading ticket balance: " + error.message);
        }
    }

    // Return tickets
    async function returnTickets() {
        // Get ticket information
        const numTickets = $("#ticketAmount").val();
        
        // Validate inputs
        if (!currentAccount) {
            showError("Please connect your wallet first");
            return;
        }
        
        if (numTickets < 1) {
            showError("Please enter a valid number of tickets");
            return;
        }
        
        try {
            // Create transaction parameters
            const txData = contract.methods.returnTicket(numTickets).encodeABI();
            
            // Show transaction in progress
            showError("Preparing transaction. Please confirm in MetaMask...");
            
            // Send transaction using MetaMask
            window.ethereum.request({
                method: 'eth_sendTransaction',
                params: [{
                    from: currentAccount,
                    to: contractAddress,
                    data: txData
                }]
            })
            .then(function(txHash) {
                showError("Transaction submitted. Waiting for confirmation.");
                
                // Wait for transaction receipt
                const checkReceipt = setInterval(function() {
                    web3.eth.getTransactionReceipt(txHash)
                        .then(function(receipt) {
                            if (receipt) {
                                clearInterval(checkReceipt);
                                $("#transactionResult").val(JSON.stringify(receipt, null, 2));
                                showError("Tickets returned successfully. Transaction hash: " + txHash);
                                
                                // Reload ticket balance
                                loadTicketBalance(currentAccount);
                                
                                // Show Etherscan link
                                $("#transactionResult").val($("#transactionResult").val() + 
                                    "\n\nView on Etherscan: https://sepolia.etherscan.io/tx/" + txHash);
                            }
                        })
                        .catch(console.error);
                }, 3000); // Check every 3 seconds
            })
            .catch(function(error) {
                showError("Transaction failed: " + error.message);
            });
            
        } catch (error) {
            showError("Error occurred while returning tickets: " + error.message);
        }
    }

 
    $("#closeModal").click(function() {
        $("#errorModal").css("display", "none");
    });

    // Show error message in modal
    function showError(message) {
        $("#errorMessage").text(message);
        $("#errorModal").css("display", "block");
    }
