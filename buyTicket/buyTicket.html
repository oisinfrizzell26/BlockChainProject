    <header>
        <h1><i class="fas fa-shopping-cart"></i> Buy Event Tickets</h1>
    </header>

            <p>Tickets Available: <span class="ticketCounter" id="availableTickets">Loading...</span></p>
        </div>

        <h2><i class="fas fa-wallet"></i> Connect Your Wallet</h2>

            <button id="connectWalletButton"><i class="fas fa-plug"></i> Connect with MetaMask</button>
        </div>

        <div id="walletDetails" style="display: none;">
            <label for="walletAddress">Connected Wallet Address:</label>
            <p id="walletAddress"></p>
            <label for="walletBalance">Wallet Balance:</label>
            <p id="walletBalance">Loading...</p>
        </div>
        
        <div id="purchaseSection" style="display: none;">
            <h2><i class="fas fa-ticket-alt"></i> Purchase Tickets</h2>
            <label for="ticketAmount">Number of Tickets:</label>
            <input type="number" id="ticketAmount" min="1" value="1">
            <p>Total Cost: <span id="totalCost">Loading...</span> ETH</p>
            <button id="buyTicketsButton"><i class="fas fa-shopping-cart"></i> Buy Tickets</button>
            <br/>
            <br/>
            <label for="transactionResult">Transaction Result:</label>
            <textarea id="transactionResult" rows="5" cols="50" readonly></textarea>
        </div>
    </div>

    <div id="errorModal" class="modal">
        <div class="modal-content">
            <span id="closeModal" class="close">&times;</span>
            <p id="errorMessage"></p>

    // Create contract instance
    const contract = new web3.eth.Contract(ABI, contractAddress);
    
    // Variables to store connected account
    let currentAccount = null;
    
    // Load ticket information when page loads
    $(document).ready(function() {
        loadTicketInfo();
        
        // Update total cost when ticket amount changes
        $("#ticketAmount").on("input", updateTotalCost);
        
        // Connect wallet button
        $("#connectWalletButton").click(connectWallet);
        
        // Buy tickets button
        $("#buyTicketsButton").click(buyTickets);
        
        // Check if MetaMask is already connected
        if (window.ethereum && window.ethereum.selectedAddress) {
            connectWallet();
        }
    });
    
    // Load ticket information from the contract
    async function loadTicketInfo() {
        try {
            // Get ticket price
            const priceWei = await contract.methods.ticketPrice().call();
            const priceEth = web3.utils.fromWei(priceWei, 'ether');
            $("#ticketPrice").text(priceEth);
            
            // Get available tickets
            const available = await contract.methods.availableTickets().call();
            $("#availableTickets").text(available);
            
            // Update total cost for default ticket amount
            updateTotalCost();
        } catch (error) {
            showError("Error loading ticket information: " + error.message);
        }
    }
    
    // Update the total cost based on ticket amount
    async function updateTotalCost() {
        const amount = $("#ticketAmount").val();
        const priceWei = await contract.methods.ticketPrice().call();
        const priceEth = web3.utils.fromWei(priceWei, 'ether');
        const totalCost = (amount * priceEth).toFixed(8);
        $("#totalCost").text(totalCost);
    }

    // Connect to MetaMask
    async function connectWallet() {
        if (window.ethereum) {
            try {
                // Request account access
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                currentAccount = accounts[0];
                
                // Check if connected to Sepolia
                const chainId = await window.ethereum.request({ method: 'eth_chainId' });
                if (chainId !== '0xaa36a7') {
                    showError("Please connect MetaMask to the Sepolia Test Network.");
                    try {
                        // Try to switch to Sepolia
                        await window.ethereum.request({
                            method: 'wallet_switchEthereumChain',
                            params: [{ chainId: '0xaa36a7' }], 
                        });
                    } catch (switchError) {
                        // Network not added
                        showError("Please manually switch to the Sepolia Test Network in MetaMask.");
                    }
                    return;
                }
                
                // Update UI
                $("#walletAddress").text(currentAccount);
                $("#walletDetails").show();
                $("#purchaseSection").show();
                $("#connectWalletButton").html('<i class="fas fa-check"></i> Connected to MetaMask');
                
                // Load wallet balance
                loadWalletBalance(currentAccount);
                
                // Listen for account changes
                window.ethereum.on('accountsChanged', function (accounts) {
                    currentAccount = accounts[0];
                    $("#walletAddress").text(currentAccount);
                    loadWalletBalance(currentAccount);
                });
                
            } catch (error) {
                showError("User denied account access or another error occurred: " + error.message);
            }
        } else {
            showError("MetaMask is not installed. Please install MetaMask to continue.");
        }
    }

    // Load wallet balance
    async function loadWalletBalance(address) {
        try {
            const balanceWei = await web3.eth.getBalance(address);
            const balanceEth = web3.utils.fromWei(balanceWei, 'ether');
            $("#walletBalance").text(balanceEth + " ETH");
        } catch (error) {
            showError("Error loading balance: " + error.message);
        }
    }

    // Buy tickets
    async function buyTickets() {
        // Get ticket information
        const numTickets = $("#ticketAmount").val();
        
        // Validate inputs
        if (!currentAccount) {
            showError("Please connect your wallet first");
            return;
        }
        
        if (numTickets < 1) {
            showError("Please enter a valid number of tickets");
            return;
        }
        
        try {
            // Get ticket price
            const priceWei = await contract.methods.ticketPrice().call();
            const totalCostWei = BigInt(priceWei) * BigInt(numTickets);
            
            // Create transaction parameters
            const txData = contract.methods.buyTicket(numTickets).encodeABI();
            
            // Show transaction in progress
            showError("Preparing transaction. Please confirm in MetaMask...");
            
            // Send transaction using MetaMask
            window.ethereum.request({
                method: 'eth_sendTransaction',
                params: [{
                    from: currentAccount,
                    to: contractAddress,
                    data: txData,
                    value: '0x' + totalCostWei.toString(16) // Convert to hex
                }]
            })
            .then(function(txHash) {
                showError("Transaction submitted. Waiting for confirmation.");
                
                // Wait for transaction receipt
                const checkReceipt = setInterval(function() {
                    web3.eth.getTransactionReceipt(txHash)
                        .then(function(receipt) {
                            if (receipt) {
                                clearInterval(checkReceipt);
                                $("#transactionResult").val(JSON.stringify(receipt, null, 2));
                                showError("Tickets purchased successfully. Transaction hash: " + txHash);
                                
                                // Reload ticket information and wallet balance
                                loadTicketInfo();
                                loadWalletBalance(currentAccount);
                                
                                // Show Etherscan link
                                $("#transactionResult").val($("#transactionResult").val() + 
                                    "\n\nView on Etherscan: https://sepolia.etherscan.io/tx/" + txHash);
                            }
                        })
                        .catch(console.error);
                }, 3000); // Check every 3 seconds
            })
            .catch(function(error) {
                showError("Transaction failed: " + error.message);
            });
            
        } catch (error) {
            showError("Error occurred while purchasing tickets: " + error.message);
        }
    }

    // Close the modal when clicking on X
    $("#closeModal").click(function() {
        $("#errorModal").css("display", "none");
    });

    // Show error message in modal
    function showError(message) {
        $("#errorMessage").text(message);
        $("#errorModal").css("display", "block");
    }
</script>
